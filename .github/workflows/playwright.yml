name: Playwright Tests

on:
  push:
    branches: [ main, dev, Daytoday ]
  pull_request:
    branches: [ main, dev, Daytoday ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1, 2, 3]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests (sharded)
      run: npx playwright test --shard=${{ matrix.shard }}/3

    # ✅ Upload Playwright HTML report
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

    # ✅ Upload Allure results (per shard)
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-shard-${{ matrix.shard }}
        path: allure-results

  merge-allure-report:
    needs: test   # ✅ FIXED
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ✅ Install Java (important for Allure)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # ✅ Download all shard results
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results

      # ✅ Merge results
      - name: Merge Allure results
        run: |
          mkdir merged-results
          find allure-results -type f -exec cp {} merged-results \;

      # ✅ Generate report
      - name: Generate Allure report
        run: allure generate merged-results --clean -o allure-report

      # ✅ Upload final report
      - name: Upload final Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-final
          path: allure-report